<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow 美學 - 管理人資料設定</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        rose: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                        },
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        /* Date picker custom style attempt for webkit */
        ::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
            transition: 0.2s;
        }
        ::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-rose-50 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- 背景裝飾動畫 (與登入頁保持一致) -->
    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-rose-200 rounded-full mix-blend-multiply filter blur-3xl opacity-60 animate-float"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-60 animate-float" style="animation-delay: 2s"></div>
    <div class="absolute top-[20%] right-[20%] w-[300px] h-[300px] bg-orange-100 rounded-full mix-blend-multiply filter blur-3xl opacity-60 animate-float" style="animation-delay: 4s"></div>

    <!-- 主卡片 -->
    <div class="glass-panel w-full max-w-lg rounded-3xl shadow-[0_8px_32px_0_rgba(31,38,135,0.07)] p-8 md:p-10 relative z-10 transition-all hover:shadow-[0_8px_32px_0_rgba(31,38,135,0.12)]">
        
        <!-- 步驟指示器 -->
        <div class="flex items-center justify-center mb-8 space-x-2">
            <div class="h-1 w-8 bg-rose-500 rounded-full"></div>
            <div class="h-1 w-8 bg-slate-200 rounded-full"></div>
            <span class="absolute right-8 top-8 text-xs font-semibold text-rose-500 tracking-wider">STEP 1/2</span>
        </div>

        <!-- 標題區域 -->
        <div class="text-center mb-8">
            <h1 class="font-serif text-2xl md:text-3xl text-slate-800 font-bold tracking-tight mb-2">總店管理人設定</h1>
            <p class="text-slate-500 text-sm font-light tracking-wide">請完善您的個人資料，以便我們提供更精準的服務</p>
        </div>

        <!-- 資料表單 -->
        <form class="space-y-6">
            
            <!-- 頭像上傳 -->
            <div class="flex flex-col items-center justify-center mb-6">
                <div class="relative group cursor-pointer">
                    <div class="w-24 h-24 rounded-full bg-rose-50 border-2 border-dashed border-rose-300 flex items-center justify-center overflow-hidden transition-all group-hover:border-rose-500 group-hover:bg-rose-100">
                        <!-- 預設圖標 -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-rose-400 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <!-- 隱藏的 Input -->
                        <input type="file" class="absolute inset-0 opacity-0 cursor-pointer" accept="image/*">
                    </div>
                    <div class="absolute bottom-0 right-0 bg-white rounded-full p-1.5 shadow-md border border-slate-100 group-hover:scale-110 transition-transform">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-slate-600" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                        </svg>
                    </div>
                </div>
                <span class="mt-2 text-xs text-slate-400 font-medium">上傳個人頭像</span>
            </div>

            <!-- 姓名與電話 (Grid Layout) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5 pl-1">真實姓名</label>
                    <input type="text" placeholder="王小美" 
                        class="w-full px-4 py-3 rounded-xl bg-white/50 border border-slate-200 focus:border-rose-300 focus:ring-4 focus:ring-rose-100 outline-none transition-all placeholder:text-slate-300 text-slate-700 font-medium">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5 pl-1">聯絡電話</label>
                    <input type="tel" placeholder="0912-345-678" 
                        class="w-full px-4 py-3 rounded-xl bg-white/50 border border-slate-200 focus:border-rose-300 focus:ring-4 focus:ring-rose-100 outline-none transition-all placeholder:text-slate-300 text-slate-700 font-medium">
                </div>
            </div>

            <!-- 生日與 Email -->
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5 pl-1">出生日期</label>
                    <div class="relative">
                        <input type="date" 
                            class="w-full px-4 py-3 rounded-xl bg-white/50 border border-slate-200 focus:border-rose-300 focus:ring-4 focus:ring-rose-100 outline-none transition-all text-slate-700 font-medium appearance-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5 pl-1">電子信箱 Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <input type="email" placeholder="example@glow.com" 
                            class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/50 border border-slate-200 focus:border-rose-300 focus:ring-4 focus:ring-rose-100 outline-none transition-all placeholder:text-slate-300 text-slate-700 font-medium">
                    </div>
                </div>
            </div>

            <!-- Action Button -->
            <div class="pt-4">
                <button type="button" class="w-full py-3.5 px-4 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-medium shadow-lg shadow-slate-300 transform active:scale-[0.98] transition-all flex items-center justify-center group">
                    下一步填寫總店資料
                    <svg class="w-4 h-4 ml-2 text-slate-400 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                </button>
            </div>

        </form>
    </div>

</body>
</html>
