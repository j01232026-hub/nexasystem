<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow 美學 - 會員登入</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        rose: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                        },
                        line: '#06C755',
                        lineHover: '#05b64d',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="bg-rose-50 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- 背景裝飾動畫 -->
    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-rose-200 rounded-full mix-blend-multiply filter blur-3xl opacity-60 animate-float"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-60 animate-float" style="animation-delay: 2s"></div>
    <div class="absolute top-[20%] right-[20%] w-[300px] h-[300px] bg-orange-100 rounded-full mix-blend-multiply filter blur-3xl opacity-60 animate-float" style="animation-delay: 4s"></div>

    <!-- 主卡片 -->
    <div class="glass-panel w-full max-w-md rounded-3xl shadow-[0_8px_32px_0_rgba(31,38,135,0.07)] p-8 md:p-10 relative z-10 transition-all hover:shadow-[0_8px_32px_0_rgba(31,38,135,0.12)]">
        
        <!-- 品牌 Logo 區域 -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-rose-100 text-rose-500 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                </svg>
            </div>
            <h1 class="font-serif text-3xl text-slate-800 font-bold tracking-tight mb-1">Glow 美學</h1>
            <p class="text-slate-500 text-sm font-light tracking-wide">歡迎回來，開啟您的美麗旅程</p>
        </div>

        <!-- 登入表單 -->
        <form class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5 pl-1">手機號碼 / 電子信箱</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400 group-focus-within:text-rose-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                    <input type="text" placeholder="請輸入帳號" 
                        class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/50 border border-slate-200 focus:border-rose-300 focus:ring-4 focus:ring-rose-100 outline-none transition-all placeholder:text-slate-400 text-slate-700 font-medium">
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1.5 pl-1">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">登入密碼</label>
                    <a href="#" class="text-xs text-rose-500 hover:text-rose-600 font-medium transition-colors">忘記密碼？</a>
                </div>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400 group-focus-within:text-rose-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                    <input type="password" placeholder="••••••••" 
                        class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/50 border border-slate-200 focus:border-rose-300 focus:ring-4 focus:ring-rose-100 outline-none transition-all text-slate-700 font-medium">
                </div>
            </div>

            <button type="button" class="w-full py-3.5 px-4 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-medium shadow-lg shadow-slate-300 transform active:scale-[0.98] transition-all flex items-center justify-center group">
                立即登入
                <svg class="w-4 h-4 ml-2 text-slate-400 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </form>

        <!-- 分隔線 -->
        <div class="relative my-8">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-slate-200"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-3 bg-white/80 text-slate-400 font-medium backdrop-blur-sm">或使用以下方式登入</span>
            </div>
        </div>

        <!-- LINE 登入按鈕 -->
        <button class="w-full py-3.5 px-4 bg-[#06C755] hover:bg-[#05b64d] text-white rounded-xl font-bold shadow-md shadow-green-100 transform active:scale-[0.98] transition-all flex items-center justify-center relative overflow-hidden group">
            <!-- LINE Logo Icon (Simple SVG) -->
            <svg class="w-6 h-6 mr-2" viewBox="0 0 24 24" fill="currentColor">
                <path d="M21.5,10.2C21.5,5.6,17.2,1.9,12,1.9S2.5,5.6,2.5,10.2c0,4.1,3.4,7.6,8.1,8.2c0.3,0.1,0.7,0.3,0.8,0.7 c0.1,0.4,0,1.5-0.1,1.9c0,0-0.3,1.3-0.4,1.6c-0.1,0.4-0.6,1.5,0.8,0.8c1.4-0.7,7.7-4.5,10.5-7.7C23.6,14.2,21.5,12.3,21.5,10.2z M12,15.7c-5.2,0-9.5-3.5-9.5-7.8c0-4.3,4.2-7.8,9.5-7.8c5.2,0,9.5,3.5,9.5,7.8C21.5,12.2,17.2,15.7,12,15.7z"/>
                <path d="M12.9,8.1h-2.1c-0.3,0-0.5,0.2-0.5,0.5v4.2c0,0.3,0.2,0.5,0.5,0.5h2.1c0.3,0,0.5-0.2,0.5-0.5v-0.6c0-0.3-0.2-0.5-0.5-0.5 h-1v-1h1c0.3,0,0.5-0.2,0.5-0.5V9.1C13.4,8.8,13.2,8.6,12.9,8.6z M7.7,13.3H7.1c-0.3,0-0.5-0.2-0.5-0.5V8.6c0-0.3,0.2-0.5,0.5-0.5 h0.6c0.3,0,0.5,0.2,0.5,0.5v3.6h1c0.3,0,0.5,0.2,0.5,0.5v0.6c0,0.3-0.2,0.5-0.5,0.5H7.7z M17.2,8.6v4.2c0,0.3,0.2,0.5,0.5,0.5 h0.6c0.3,0,0.5-0.2,0.5-0.5V8.6c0-0.3-0.2-0.5-0.5-0.5h-0.6C17.4,8.1,17.2,8.3,17.2,8.6z M15.5,13.3h-0.6c-0.3,0-0.5-0.2-0.5-0.5 V8.6c0-0.3,0.2-0.5,0.5-0.5h0.6c0.3,0,0.5,0.2,0.5,0.5v4.2C15.9,13.1,15.7,13.3,15.5,13.3z"/>
            </svg>
            使用 LINE 帳號登入
        </button>

        <!-- 頁腳 / 註冊 -->
        <div class="mt-8 text-center">
            <p class="text-sm text-slate-500">
                還沒有會員帳號？
                <a href="#" class="font-semibold text-rose-500 hover:text-rose-600 transition-colors ml-1 relative group inline-block">
                    立即註冊
                    <span class="absolute bottom-0 left-0 w-full h-0.5 bg-rose-500 transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left"></span>
                </a>
            </p>
        </div>
    </div>

</body>
</html>
