<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow 美學 - 帳號管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        rose: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                        },
                    }
                }
            }
        }
    </script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');
        
        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.02);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body class="bg-rose-50 min-h-screen pb-24 relative">

    <!-- 背景裝飾 (淡化版) -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[400px] h-[400px] bg-rose-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[400px] h-[400px] bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
    </div>

    <!-- 頂部導航欄 -->
    <header class="glass-header fixed top-0 left-0 right-0 z-50 px-4 h-14 flex items-center justify-center">
        <h1 class="text-slate-800 font-bold text-lg tracking-wide">帳號管理</h1>
    </header>

    <!-- 主要內容區 -->
    <main class="container mx-auto px-4 pt-20 max-w-2xl space-y-6">

        <!-- 總店資訊卡片 -->
        <div class="bg-white rounded-3xl shadow-[0_4px_20px_0_rgba(0,0,0,0.03)] overflow-hidden border border-slate-100">
            <!-- 封面圖 -->
            <div class="h-32 bg-gradient-to-r from-rose-100 to-orange-100 relative">
                <!-- 編輯封面按鈕 -->
                <button class="absolute top-3 right-3 p-1.5 bg-white/30 hover:bg-white/50 backdrop-blur-sm rounded-full text-white transition-all">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                    </svg>
                </button>
            </div>
            
            <div class="px-6 pb-6">
                <!-- 總店基本資料 -->
                <div class="relative -mt-10 mb-6 flex items-end justify-between">
                    <div>
                        <div class="w-20 h-20 rounded-2xl bg-white p-1 shadow-md">
                            <div class="w-full h-full bg-rose-50 rounded-xl flex items-center justify-center text-rose-300">
                                <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>
                            </div>
                        </div>
                        <div class="mt-3">
                            <h2 class="text-xl font-bold text-slate-800">Glow 美學台北旗艦店</h2>
                            <p class="text-xs text-rose-500 font-medium tracking-wide uppercase mt-0.5">總店 Head Office</p>
                        </div>
                    </div>
                </div>

                <div class="space-y-3 mb-8">
                    <div class="flex items-center text-sm text-slate-600">
                        <svg class="w-4 h-4 mr-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>
                        02-1234-5678
                    </div>
                    <div class="flex items-center text-sm text-slate-600">
                        <svg class="w-4 h-4 mr-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                        台北市大安區忠孝東路四段 123 號
                    </div>
                </div>

                <!-- 分隔線 -->
                <div class="border-t border-slate-100 my-6"></div>

                <!-- 總店員工列表 -->
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-sm font-bold text-slate-800">總店員工列表</h3>
                        <button class="text-xs font-semibold text-rose-500 hover:text-rose-600 hover:bg-rose-50 px-2 py-1 rounded-md transition-colors flex items-center">
                            <svg class="w-3 h-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                            新增員工
                        </button>
                    </div>

                    <!-- 員工列表 -->
                    <div class="space-y-3">
                        <!-- 員工 Item (管理人) -->
                        <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-100 group hover:border-rose-200 transition-colors">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-full bg-rose-100 flex items-center justify-center overflow-hidden">
                                    <!-- 假頭像 -->
                                    <svg class="w-6 h-6 text-rose-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" /></svg>
                                </div>
                                <div>
                                    <div class="flex items-center">
                                        <p class="text-sm font-semibold text-slate-800">王小美</p>
                                        <span class="ml-2 px-1.5 py-0.5 bg-slate-200 text-slate-600 text-[10px] font-bold rounded">管理人</span>
                                    </div>
                                    <p class="text-xs text-slate-500">0912-345-678</p>
                                </div>
                            </div>
                            <!-- 操作按鈕 -->
                            <div class="flex items-center space-x-1 opacity-60 group-hover:opacity-100 transition-opacity">
                                <button class="p-1.5 text-slate-400 hover:text-blue-500 hover:bg-blue-50 rounded-lg transition-colors">
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                                </button>
                                <button class="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors">
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 分店管理區塊 -->
        <div>
            <div class="flex items-center justify-between mb-4 px-1">
                <h3 class="text-lg font-bold text-slate-800">分店管理</h3>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <!-- 新增分店按鈕 -->
                <button class="col-span-1 h-32 rounded-2xl border-2 border-dashed border-slate-300 hover:border-rose-400 hover:bg-rose-50/50 flex flex-col items-center justify-center text-slate-400 hover:text-rose-500 transition-all group">
                    <div class="w-10 h-10 rounded-full bg-slate-100 group-hover:bg-rose-100 flex items-center justify-center mb-2 transition-colors">
                        <svg class="w-6 h-6 text-slate-400 group-hover:text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                    </div>
                    <span class="text-sm font-semibold">新增分店</span>
                </button>

                <!-- 新增分店員工按鈕 -->
                <button class="col-span-1 h-32 rounded-2xl border-2 border-dashed border-slate-300 hover:border-rose-400 hover:bg-rose-50/50 flex flex-col items-center justify-center text-slate-400 hover:text-rose-500 transition-all group">
                    <div class="w-10 h-10 rounded-full bg-slate-100 group-hover:bg-rose-100 flex items-center justify-center mb-2 transition-colors">
                        <svg class="w-6 h-6 text-slate-400 group-hover:text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" /></svg>
                    </div>
                    <span class="text-sm font-semibold">新增分店員工</span>
                </button>
            </div>
        </div>

    </main>

    <!-- 底部導航欄 -->
    <nav class="glass-nav fixed bottom-0 w-full h-20 pb-4 z-50">
        <div class="flex justify-around items-center h-full max-w-2xl mx-auto">
            <!-- 設定 -->
            <a href="#" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600 transition-colors group">
                <i class="ph-light ph-sliders text-2xl mb-1 group-hover:-translate-y-0.5 transition-transform"></i>
                <span class="text-[10px] font-medium tracking-wide">設定</span>
            </a>

            <!-- 預約 -->
            <a href="#" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600 transition-colors group">
                <i class="ph-light ph-calendar-heart text-2xl mb-1 group-hover:-translate-y-0.5 transition-transform"></i>
                <span class="text-[10px] font-medium tracking-wide">預約</span>
            </a>

            <!-- 客服 -->
            <a href="#" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600 transition-colors group">
                <i class="ph-light ph-chat-circle-dots text-2xl mb-1 group-hover:-translate-y-0.5 transition-transform"></i>
                <span class="text-[10px] font-medium tracking-wide">客服</span>
            </a>

            <!-- 帳號管理 (Active) -->
            <a href="#" class="flex flex-col items-center justify-center w-full h-full text-rose-500 relative group">
                <!-- Active Indicator -->
                <div class="absolute top-2 w-12 h-10 bg-rose-50 rounded-xl -z-10 opacity-60"></div>
                <i class="ph-fill ph-user-circle text-2xl mb-1"></i>
                <span class="text-[10px] font-bold tracking-wide">帳號管理</span>
            </a>
        </div>
    </nav>

</body>
</html>
